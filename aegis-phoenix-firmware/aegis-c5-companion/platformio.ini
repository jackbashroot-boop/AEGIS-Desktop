; AEGIS ESP32-C5 companion (hot-swap 5 GHz coprocessor for Cardputer ADV)
; The ESP32-C5 needs Arduino-ESP32 core 3.x. The known-good build path
; is arduino-cli (see README.md in this folder) - the pioarduino board
; IDs for C5 boards vary by release, so this file is a starting point:
; set `board` to a C5 board your installed platform actually provides
; (check `pio boards espressif32 | grep -i c5`) and set the LINK pins
; to the GPIOs wired to the Grove cable.
[env:c5-companion]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c5-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLINK_RX_PIN=8
    -DLINK_TX_PIN=9
