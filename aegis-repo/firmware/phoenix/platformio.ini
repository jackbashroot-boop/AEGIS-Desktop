; PlatformIO Project Configuration File for M5Stack Cardputer ADV
; AEGIS PHOENIX Blue-Team Sensor Firmware (evolved from PHOENIX agent)
[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
platform = espressif32 @ ^6.6.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000

board_build.partitions = default_8MB.csv

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_M5STACK_CARDPUTER
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -Wall
    -Wextra
    -Wno-unused-parameter
    ; Optional expansion hardware. Leave at 0 until the hardware + EXT pin
    ; plan exists: all three drivers historically fight over G1/G2/UART.
    -DAEGIS_ENABLE_C5=1
    -DAEGIS_ENABLE_LORA=1
    -DAEGIS_ENABLE_GNSS=1

lib_deps =
    m5stack/M5Cardputer @ ^1.0.3
    bblanchon/ArduinoJson @ ^7.0.4
    h2zero/NimBLE-Arduino @ ^2.1.0
    jgromes/RadioLib @ ^7.0.0
